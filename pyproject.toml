[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapascrape"
version = "0.1.0"
description = "Scrape Tapatalk boards into SQL databases"
requires-python = ">=3.11"
dependencies = [
    "PyMySQL>=1.1",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Passes Cloudflare for the HTML pass (enrich) by driving the installed Chrome.
browser = ["zendriver>=0.15"]

[project.scripts]
tapascrape = "tapascrape.cli:main"

[tool.setuptools.packages.find]
include = ["tapascrape*"]

[tool.setuptools.package-data]
"tapascrape.site" = ["*.css"]
